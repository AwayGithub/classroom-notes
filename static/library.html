<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课程资料 · 听课</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/library.css"></head>
<body><header><div class="brand">听课<span>COURSE LIBRARY</span></div><a class="navlink" href="/">返回实时课堂</a></header>
<main><section class="intro"><div><div class="eyebrow">回看、汇集，再整理</div><h1>课程资料</h1><p>查看历史转写和笔记，将分段记录合成一节完整的课。</p></div><button id="refresh">刷新记录</button></section>
<div id="libraryMessage" role="status" aria-live="polite">正在读取本机记录…</div>
<div class="library-grid"><aside class="panel catalog"><div class="panelhead"><h2 id="listHeading">历史记录</h2><span id="recordCount"></span></div><label class="search">搜索课程<input id="search" type="search" placeholder="输入课程名称或日期"></label><div class="batch-tools"><button id="selectVisible">全选搜索结果</button><button id="trashView">查看回收站</button></div><div id="records" class="record-list"></div>
<section class="merge-box"><h2>所选记录</h2><p id="selectionHint">勾选记录可批量删除，删除后可从回收站恢复。合并需至少两份非空转写，顺序可在下方调整。</p><ol id="selected"></ol><label>新记录标题<input id="mergeTitle" maxlength="200" placeholder="例如：强制执行法 · 完整课堂"></label><div class="merge-actions"><button id="deleteSelected" class="danger" disabled>删除所选记录</button><button id="restoreSelected" hidden disabled>恢复所选记录</button><button id="clearSelection">清空选择</button><button id="merge" class="primary" disabled>合并为新记录</button></div></section></aside>
<article class="panel reader"><div class="panelhead"><h2 id="detailTitle">选择一份记录</h2><a id="download" hidden>导出 Markdown ↗</a></div><p id="detailMeta" class="detail-meta">点击左侧记录标题，查看转写原文与课程笔记。</p><div class="reader-tabs"><button id="transcriptTab" aria-pressed="true">转写原文</button><button id="notesTab" aria-pressed="false">课程笔记</button><button id="rewrite" disabled>重新整理全文</button></div><div id="detailBody" class="panelbody text">尚未选择记录。</div><footer id="detailFooter">内容保存在本机</footer></article></div></main>
<script src="/static/notes-renderer.js"></script><script src="/static/library.js"></script></body></html>
